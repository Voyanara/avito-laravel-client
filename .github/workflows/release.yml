name: Release

# Push a tag (e.g. `git tag 1.2.2 && git push origin 1.2.2`):
# the tests run first, and only if they pass a GitHub release is created.
# Release notes are taken from the matching "## [1.2.2]" section of CHANGELOG.md;
# if there is no such section, GitHub generates them from the commits.
# If a release with this tag already exists, its title and notes are updated.
on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    name: Create GitHub release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          echo "Release notes for $GITHUB_REF_NAME:"
          cat notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          has_notes=false
          if grep -q '[^[:space:]]' notes.md; then
            has_notes=true
          fi

          # A release with this tag may already exist: created by hand, or an old one
          # that GitHub re-attached when the tag was pushed again. Update it instead of failing.
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, updating it"
            if [ "$has_notes" = true ]; then
              gh release edit "$tag" --title "$tag" --notes-file notes.md --draft=false
            else
              gh release edit "$tag" --title "$tag" --draft=false
            fi
          elif [ "$has_notes" = true ]; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi
